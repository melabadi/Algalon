name: Indexing Reliability

on:
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: indexing-reliability
  cancel-in-progress: false

jobs:
  synthetic-history:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Install worker dependencies
        run: npm ci
      - name: Install API and test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Build the worker
        run: npm run build
      - name: Check ongoing freshness and restart recovery
        run: python -m scripts.indexing_reliability --spans 730000 --sessions 250 --updates 40