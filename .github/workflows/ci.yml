name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  security:
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read
      actions: read
      security-events: write

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: npm ci

      - name: Install web dependencies
        run: npm ci --prefix web

      - name: Install Python test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Test with 90% line coverage
        run: npm run test:coverage

      - name: Build React app
        run: npm run build --prefix web

      - name: Validate portable bundle construction
        run: python scripts/copilot_value.py bundle --skip-tests --output-directory .ci-artifacts

  bundle:
    needs: [test, security]
    runs-on: windows-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Determine artifact version
        id: version
        shell: pwsh
        run: |
          $isMainPush = '${{ github.event_name }}' -eq 'push' -and '${{ github.ref }}' -eq 'refs/heads/main'
          if ($isMainPush) {
            $version = python scripts/next_patch_version.py
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            npm version $version --no-git-tag-version
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "Building version $version"

      - name: Install dependencies
        run: npm ci

      - name: Build release bundle
        run: python scripts/copilot_value.py bundle --skip-tests

      - name: Smoke extracted bundle
        run: python scripts/copilot_value.py smoke-bundle --skip-build --skip-telemetry

      - name: Upload release artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: copilot-value-dashboard-${{ steps.version.outputs.version }}
          path: |
            artifacts/*.zip
            artifacts/*.pyz
            artifacts/*.sha256
          if-no-files-found: error

  linux-bundle-smoke:
    needs: bundle
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Download release artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: copilot-value-dashboard-${{ needs.bundle.outputs.version }}
          path: artifacts

      - name: Verify checksum
        shell: bash
        run: cd artifacts && sha256sum --check *.sha256

      - name: Smoke portable Docker bundle
        run: python scripts/copilot_value.py smoke-bundle --skip-build --bundle artifacts/copilot-value-dashboard-${{ needs.bundle.outputs.version }}.pyz

      - name: Smoke ZIP packaging
        run: python scripts/copilot_value.py smoke-bundle --skip-build --skip-telemetry --bundle artifacts/copilot-value-dashboard-${{ needs.bundle.outputs.version }}.zip

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [bundle, linux-bundle-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Download smoke-tested release artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: copilot-value-dashboard-${{ needs.bundle.outputs.version }}
          path: artifacts

      - name: Verify release assets
        shell: bash
        run: |
          set -euo pipefail
          version='${{ needs.bundle.outputs.version }}'
          assets=(
            "artifacts/copilot-value-dashboard-${version}.pyz"
            "artifacts/copilot-value-dashboard-${version}.pyz.sha256"
            "artifacts/copilot-value-dashboard-${version}.zip"
            "artifacts/copilot-value-dashboard-${version}.zip.sha256"
          )
          for asset in "${assets[@]}"; do
            test -f "$asset"
          done
          (cd artifacts && sha256sum --check *.sha256)

      - name: Attest smoke-tested release artifacts
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
        with:
          subject-path: |
            artifacts/*.pyz
            artifacts/*.zip

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version='${{ needs.bundle.outputs.version }}'
          tag="v${version}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists; refusing to overwrite it." >&2
            exit 1
          fi
          gh release create "$tag" \
            "artifacts/copilot-value-dashboard-${version}.pyz" \
            "artifacts/copilot-value-dashboard-${version}.pyz.sha256" \
            "artifacts/copilot-value-dashboard-${version}.zip" \
            "artifacts/copilot-value-dashboard-${version}.zip.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$tag" \
            --draft \
            --generate-notes
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --latest
