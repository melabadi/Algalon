name: Pages

on:
  push:
    branches: [main]
    paths:
      - site/**
      - docs/images/**
      - config/value-model.example.json
      - .github/workflows/pages.yml
      - test/test_pages_site.py
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate static site
        run: |
          node --check site/app.js
          python -m unittest discover -s test -p test_pages_site.py

      - name: Assemble Pages artifact
        run: python scripts/build_pages_site.py

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10

    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4