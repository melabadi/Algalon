name: Security

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: '23 5 * * 1'

permissions:
  contents: read

jobs:
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Audit worker dependencies
        run: npm audit --audit-level=low
      - name: Audit frontend dependencies
        run: npm audit --prefix web --audit-level=low
      - name: Audit Python dependencies
        run: |
          python -m pip install pip-audit==2.9.0
          python -m pip_audit -r requirements-dev.txt --strict

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
        with:
          fail-on-severity: low

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7
        env:
          GITHUB_TOKEN: ${{ github.token }}

  codeql:
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f5948dfacef28e207b48d0905cf90c03365536d
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - name: Analyze and publish findings
        uses: github/codeql-action/analyze@6f5948dfacef28e207b48d0905cf90c03365536d
        with:
          category: /language:${{ matrix.language }}
          output: sarif-results
          wait-for-processing: true
      - name: Block release on CodeQL findings
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          reports = list(Path("sarif-results").glob("*.sarif"))
          if not reports:
              raise SystemExit("CodeQL did not produce a SARIF report.")
          findings = sum(
              len(run.get("results", []))
              for report in reports
              for run in json.loads(report.read_text(encoding="utf-8"))["runs"]
          )
          if findings:
              raise SystemExit(f"CodeQL reported {findings} finding(s). Review code scanning alerts before releasing.")
          print("CodeQL reported no findings.")
          PY